# A pull request author cannot review their own change. Reviewer assignment can
# be enabled when another maintainer is added to this repository.
addReviewers: false

# Use the action's explicit author mode. A normal assignee list filters the pull
# request author out, which made the previous single-user configuration empty.
addAssignees: author

# Assign draft pull requests when they are opened as well as ready pull requests.
runOnDraft: true
