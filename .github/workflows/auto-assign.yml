# kics-scan disable=555ab8f9-2001-455e-a077-f2d0f41e2fb9
name: Auto Assign

on:
  pull_request:
    types: [opened]

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: kentaro-m/auto-assign-action@v2.0.1
        with:
          configuration-path: .github/auto_assign.yml
