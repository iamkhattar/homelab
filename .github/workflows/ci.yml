name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "24"
  TERRAFORM_VERSION: "1.14.6"
  RELEASE_VERSION: "v0.1.${{ github.run_number }}"

jobs:
  check:
    name: Check
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            homelabctl/go.sum
            services/butler/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Build homelabctl
        run: go build -trimpath -o "$GITHUB_WORKSPACE/bin/homelabctl" ./cmd/homelabctl
        working-directory: homelabctl

      - name: Install repository dependencies
        run: bin/homelabctl setup

      - name: Run repository checks
        run: bin/homelabctl ci check --reports
        env:
          CI: "true"

      - name: Upload test, security and SBOM reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.sha }}
          path: |
            test-results/
            sarif/
            sbom/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload security findings to code scanning
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif
          category: homelabctl

  publish:
    name: Build container images
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: homelabctl/go.sum

      - name: Build homelabctl
        run: go build -trimpath -o "$GITHUB_WORKSPACE/bin/homelabctl" ./cmd/homelabctl
        working-directory: homelabctl

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build changed images
        if: github.event_name == 'pull_request'
        run: |
          bin/homelabctl ci build \
            --changed \
            --base "origin/${{ github.base_ref }}" \
            --tag "${{ github.sha }}"

      - name: Build and push changed images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          bin/homelabctl ci publish \
            --changed \
            --base "${{ github.event.before }}" \
            --tag "${{ env.RELEASE_VERSION }}" \
            --tag latest \
            --tag "${{ github.sha }}"
        env:
          CI: "true"

  release:
    name: Release homelabctl
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: homelabctl/go.sum

      - name: Create immutable GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
          workdir: homelabctl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_VERSION }}
