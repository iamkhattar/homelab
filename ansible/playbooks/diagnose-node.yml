---
- name: Collect Debian node diagnostics
  hosts: k3s_cluster
  gather_facts: true
  become: true
  tasks:
    - name: Run read-only host diagnostic commands
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - hostnamectl
        - systemctl --failed --no-pager
        - sshd -t
        - df -h
        - findmnt --noheadings --output SOURCE,TARGET,FSTYPE,OPTIONS /boot/efi
        - swapon --show --noheadings
        - systemctl is-active chrony.service fstrim.timer
        - systemctl is-enabled chrony.service fstrim.timer
        - timedatectl status
        - localectl status
        - ip -brief address
        - ip route show default
        - getent ahosts deb.debian.org
      register: homelab_node_diagnostics
      changed_when: false
      failed_when: false

    - name: Report host diagnostics
      ansible.builtin.debug:
        msg:
          command: "{{ item.item }}"
          return_code: "{{ item.rc }}"
          stdout: "{{ item.stdout_lines | default([]) }}"
          stderr: "{{ item.stderr_lines | default([]) }}"
      loop: "{{ homelab_node_diagnostics.results }}"
      loop_control:
        label: "{{ item.item }}"
