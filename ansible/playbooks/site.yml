---
- name: Prepare operating systems
  ansible.builtin.import_playbook: prepare.yml

- name: Install or reconcile K3s
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Verify the cluster
  hosts: "server[0]"
  gather_facts: false
  become: true
  tasks:
    - name: Wait for all Kubernetes nodes to become ready
      ansible.builtin.command:
        cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      register: homelab_cluster_ready
      changed_when: false
      retries: 3
      delay: 10
      until: homelab_cluster_ready.rc == 0

    - name: Show Kubernetes nodes
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o wide
      register: homelab_cluster_nodes
      changed_when: false

    - name: Report Kubernetes nodes
      ansible.builtin.debug:
        var: homelab_cluster_nodes.stdout_lines
