vault:
  address: http://vault.security.svc.cluster.local:8200
  # The database secrets engine is configured by the chart values. The
  # embedded fallback leaves it disabled; local development has no PostgreSQL.
  database:
    enabled: false
    address: postgresql.databases.svc.cluster.local:5432

server:
  port: "8080"

reconcile:
  interval: 1m

# OIDC issuer (Pocket ID). Wired to Vault's auth/jwt mount and used to
# validate tokens hitting Butler's normal API.
oidc:
  issuer: ""        # e.g. https://auth.shivlab.com — set via chart values
  # Pocket ID stamps the requesting client's ID as the ID token audience, so
  # this lists the clients whose tokens Butler accepts. homelabctl is the CLI.
  allowedClients:
    - homelabctl
  # Group names are configuration, not constants: renaming a group must not
  # require a code change. An empty name disables that tier. The operator tier
  # is disabled: cluster operations belong to Vault and Kubernetes groups, not
  # to a Butler middle tier.
  groups:
    admin: butleradmin
    operator: ""
    viewer: butlerviewer
  adminURL: http://pocket-id.security.svc.cluster.local

certificates:
  acmeDNSURL: https://auth.acme-dns.io
  domain: 6940469.xyz
  credentialPath: infrastructure/acme-dns
  namespace: networking
  certificateName: homelab-wildcard
  tlsSecretName: homelab-wildcard-tls

# Vault Kubernetes secrets engine — Vault as the universal credential broker
# for K8s. The embedded local-development fallback leaves it disabled.
#
# These roles configure the kubernetes/ secrets engine only: the
# kubernetes/roles/<name> entry and the ServiceAccount whose token it mints.
# The auth/jwt roles that map Pocket ID groups to Vault policies are declared
# separately by the Vault chart as VaultOIDCRole resources, so there is exactly
# one source of truth for authorization.
k8sIssuance:
  enabled: false
  hostNamespace: kube-system
  tokenReviewerNamespace: security
  tokenReviewerSA: vault-k8s-token-reviewer
  tokenReviewerRef: vault-k8s-token-reviewer-token
  roles:
    - name: k8sadmin
      serviceAccountName: vault-managed-admin
      ttl: 1h
      maxTTL: 8h
    - name: k8soperator
      serviceAccountName: vault-managed-operator
      ttl: 1h
      maxTTL: 8h
    - name: k8sviewer
      serviceAccountName: vault-managed-viewer
      ttl: 1h
      maxTTL: 4h
