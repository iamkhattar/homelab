replicaCount: 1

image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.1.2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 3000

env:
  HOMEPAGE_ALLOWED_HOSTS: "home.6940469.xyz"
  HOMEPAGE_AUTH_ENABLED: "true"
  HOMEPAGE_EXTERNAL_URL: "https://home.6940469.xyz"
  HOMEPAGE_OIDC_ISSUER: "https://auth.6940469.xyz"
  HOMEPAGE_OIDC_NAME: "Pocket ID"

secretEnv:
  - name: HOMEPAGE_AUTH_SECRET
    secretName: homepage-auth
    key: auth-secret
  - name: HOMEPAGE_OIDC_CLIENT_ID
    secretName: homepage-oidc
    key: client_id
  - name: HOMEPAGE_OIDC_CLIENT_SECRET
    secretName: homepage-oidc
    key: client_secret

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Homepage is configured via ConfigMap mounted to /app/config
config:
  settings.yaml: |
    title: Homelab
    favicon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
    headerStyle: clean
    layout:
      - Smart Home:
          icon: home-assistant
      - Monitoring:
          icon: grafana
      - Applications:
          icon: docker
      - Infrastructure:
          icon: server
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
        nodes:
          show: true
  services.yaml: |
    - Smart Home:
        - Home Assistant:
            href: https://ha.6940469.xyz
            icon: home-assistant
            description: Home automation
        - Zigbee2MQTT:
            href: https://zigbee.6940469.xyz
            icon: zigbee2mqtt
            description: Zigbee device management
    - Monitoring:
        - Grafana:
            href: http://grafana.monitoring.svc.cluster.local:80
            icon: grafana
            description: Dashboards and metrics
        - Prometheus:
            href: http://prometheus-server.monitoring.svc.cluster.local:80
            icon: prometheus
            description: Metrics collection
    - Applications:
        - Paperless-ngx:
            href: http://paperless-ngx.paperless-ngx.svc.cluster.local:8000
            icon: paperless-ngx
            description: Document management
        - Vaultwarden:
            href: http://vaultwarden.vaultwarden.svc.cluster.local:80
            icon: vaultwarden
            description: Password manager
        - KitchenOwl:
            href: http://kitchenowl.kitchenowl.svc.cluster.local:8080
            icon: kitchenowl
            description: Grocery and recipe management
        - ntfy:
            href: http://ntfy.ntfy.svc.cluster.local:80
            icon: ntfy
            description: Push notifications
    - Infrastructure:
        - Vault:
            href: http://vault.security.svc.cluster.local:8200
            icon: vault
            description: Secrets management
        - Pocket ID:
            href: http://pocket-id.security.svc.cluster.local:80
            icon: authentik
            description: OIDC authentication
  bookmarks.yaml: ""
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
