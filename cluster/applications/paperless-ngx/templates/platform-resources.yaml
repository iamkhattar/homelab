apiVersion: platform.6940469.xyz/v1alpha1
kind: ManagedCredential
metadata:
  name: paperless-ngx
  namespace: {{ .Release.Namespace }}
spec:
  vaultPath: applications/paperless-ngx
  fields:
    secret-key:
      generate: {type: password, length: 48}
    admin-user:
      value: admin
    admin-password:
      generate: {type: password, length: 32}
---
apiVersion: platform.6940469.xyz/v1alpha1
kind: ManagedCredential
metadata:
  name: paperless-ngx-database
  namespace: {{ .Release.Namespace }}
spec:
  vaultPath: applications/paperless-ngx/database
  fields:
    username:
      value: paperless
    password:
      sourceRef: {path: databases/postgresql, key: paperless-password}
---
apiVersion: platform.6940469.xyz/v1alpha1
kind: ManagedCredential
metadata:
  name: paperless-ngx-redis
  namespace: {{ .Release.Namespace }}
spec:
  vaultPath: applications/paperless-ngx/redis
  fields:
    redis-url:
      sourceRef: {path: databases/redis, key: redis-url}
