replicaCount: 1

image:
  repository: vaultwarden/server
  tag: "1.37.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 80

env:
  DOMAIN: "https://vaultwarden.6940469.xyz"
  SIGNUPS_ALLOWED: "false"
  INVITATIONS_ALLOWED: "true"
  SHOW_PASSWORD_HINT: "false"
  ROCKET_PORT: "80"
  SSO_ENABLED: "true"
  SSO_ONLY: "false"
  SSO_AUTHORITY: "https://auth.6940469.xyz"
  SSO_SCOPES: "email profile"

envFromSecrets:
  - secretName: vaultwarden-credentials
    keys:
      ADMIN_TOKEN: admin-token
  - secretName: vaultwarden-database
    keys:
      DATABASE_URL: database-url
  - secretName: vaultwarden-oidc
    keys:
      SSO_CLIENT_ID: client_id
      SSO_CLIENT_SECRET: client_secret

persistence:
  enabled: true
  size: 2Gi
  accessMode: ReadWriteOnce
  mountPath: /data
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
