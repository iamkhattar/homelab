gha-runner-scale-set-controller:
  replicaCount: 1
  serviceAccount:
    create: true
    name: arc-controller
  flags:
    logLevel: info
    logFormat: json
  metrics:
    controllerManagerAddr: ":8080"
    listenerAddr: ":8080"
    listenerEndpoint: "/metrics"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Runner scale sets are separate releases so their credentials, capacity and
# permissions can change without replacing the controller.
