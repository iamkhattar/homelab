{{- range .Values.roleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: rbac-policies
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ .namespace }}
roleRef:
  kind: Role
  name: {{ .role }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
