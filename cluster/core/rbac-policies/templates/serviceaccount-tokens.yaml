{{- /*
Long-lived ServiceAccount token Secrets. Modern Kubernetes does NOT
auto-create these (kubernetes.io/service-account-token); TokenRequest is the
preferred path. But the Vault Kubernetes secrets engine needs a long-lived
JWT once at bootstrap to call TokenReview / TokenRequest, so we materialize
one Secret per entry here.
*/}}
{{- range .Values.serviceAccountTokens }}
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .serviceAccount }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: rbac
    app.kubernetes.io/managed-by: rbac-policies
{{- end }}
