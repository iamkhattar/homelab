serviceAccounts:
  - name: prometheus
    namespace: monitoring
  - name: fluent-bit
    namespace: monitoring
  - name: database-operator
    namespace: databases
  - name: storage-admin
    namespace: storage

clusterRoles:
  - name: prometheus
    rules:
      - apiGroups: [""]
        resources: ["nodes", "nodes/metrics", "services", "endpoints", "pods"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["ingresses"]
        verbs: ["get", "list", "watch"]
      - nonResourceURLs: ["/metrics"]
        verbs: ["get"]

  - name: fluent-bit
    rules:
      - apiGroups: [""]
        resources: ["namespaces", "pods", "pods/log"]
        verbs: ["get", "list", "watch"]

  - name: storage-admin
    rules:
      - apiGroups: [""]
        resources: ["persistentvolumes", "persistentvolumeclaims"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

roles:
  - name: database-operator
    namespace: databases
    rules:
      - apiGroups: [""]
        resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      - apiGroups: ["apps"]
        resources: ["statefulsets", "deployments"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

clusterRoleBindings:
  - name: prometheus
    serviceAccount: prometheus
    namespace: monitoring
    clusterRole: prometheus
  - name: fluent-bit
    serviceAccount: fluent-bit
    namespace: monitoring
    clusterRole: fluent-bit
  - name: storage-admin
    serviceAccount: storage-admin
    namespace: storage
    clusterRole: storage-admin

roleBindings:
  - name: database-operator
    namespace: databases
    serviceAccount: database-operator
    role: database-operator
