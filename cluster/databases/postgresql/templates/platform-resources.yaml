apiVersion: platform.6940469.xyz/v1alpha1
kind: ManagedCredential
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
spec:
  vaultPath: databases/postgresql
  fields:
    postgres-password:
      generate: {type: password, length: 32}
    kitchenowl-password:
      generate: {type: password, length: 32}
    paperless-password:
      generate: {type: password, length: 32}
    vaultwarden-password:
      generate: {type: password, length: 32}
    # Pocket ID keeps its identity store in PostgreSQL rather than SQLite, so
    # its role and database are created here with the same generated password
    # every other consumer receives.
    pocketid-password:
      generate: {type: password, length: 32}
    vaultwarden-url:
      template: {{ printf "postgresql://vaultwarden:{{vaultwarden-password}}@postgresql.databases.svc.cluster.local:5432/vaultwarden" | quote }}
    pocketid-url:
      template: {{ printf "postgresql://pocketid:{{pocketid-password}}@postgresql.databases.svc.cluster.local:5432/pocketid" | quote }}
    init.sql:
      template: {{ printf "CREATE ROLE kitchenowl LOGIN PASSWORD '{{kitchenowl-password}}';\nCREATE DATABASE kitchenowl OWNER kitchenowl;\nCREATE ROLE paperless LOGIN PASSWORD '{{paperless-password}}';\nCREATE DATABASE paperless OWNER paperless;\nCREATE ROLE vaultwarden LOGIN PASSWORD '{{vaultwarden-password}}';\nCREATE DATABASE vaultwarden OWNER vaultwarden;\nCREATE ROLE pocketid LOGIN PASSWORD '{{pocketid-password}}';\nCREATE DATABASE pocketid OWNER pocketid;" | quote }}
