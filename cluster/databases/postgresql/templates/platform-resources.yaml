apiVersion: platform.6940469.xyz/v1alpha1
kind: ManagedCredential
metadata:
  name: postgresql
  namespace: {{ .Release.Namespace }}
spec:
  vaultPath: databases/postgresql
  # This document used to hold every application password plus init.sql.
  # Prune makes the declaration authoritative so those removed fields are
  # deleted on the next reconcile instead of being preserved forever.
  prune: true
  fields:
    # Vault needs the PostgreSQL superuser password to open its database
    # secrets-engine connection and to set or rotate the password on a static
    # role. This is the only credential that stays in KV.
    #
    # Application credentials are no longer generated here. Pocket ID, the only
    # deployed database consumer, receives a Vault static role declared beside
    # its own chart; its passwordless PostgreSQL role and database are created
    # by this chart's provisioning Job. If another consumer is added it must
    # declare its own VaultDatabaseRole and provisioning entry rather than a
    # password in this document.
    postgres-password:
      generate: {type: password, length: 32}
