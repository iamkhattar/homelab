postgresql:
  # Bitnami's community catalog publishes only a mutable latest tag. Pin the
  # current multi-architecture manifest digest so a pod restart cannot silently
  # change the PostgreSQL build. Renovation must update chart and digest
  # together.
  image:
    digest: sha256:40a261ed77f3b8dc65eeeec98bb79c4d3ef3410d7e2af7cfcf3785a6af00e4c5
  auth:
    existingSecret: postgresql-credentials
    secretKeys:
      adminPasswordKey: postgres-password
    database: homelab
  primary:
    initdb:
      scriptsSecret: postgresql-initdb
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    networkPolicy:
      enabled: true
      allowExternal: false
      allowExternalEgress: false
      extraIngress:
        - from:
            - namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values: [kitchenowl, paperless-ngx, vaultwarden]
          ports:
            - protocol: TCP
              port: 5432
      extraEgress:
        - to:
            - namespaceSelector: {}
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - {protocol: UDP, port: 53}
            - {protocol: TCP, port: 53}
  metrics:
    enabled: true
    image:
      digest: sha256:b672b54e6dbb277d098182cf9708aaaea3b7f2bc2d4f1917c5fb34ffcaa19e05
    serviceMonitor:
      enabled: false
