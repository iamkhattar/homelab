environments:
  default:
    values:
      - ./helmfile-values.yaml

---

repositories:
  - name: cert-manager
    url: https://charts.jetstack.io
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: fluent
    url: https://fluent.github.io/helm-charts
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: crowdsec
    url: https://crowdsecurity.github.io/helm-charts
  - name: gatekeeper
    url: https://open-policy-agent.github.io/gatekeeper/charts
  - name: tailscale
    url: https://pkgs.tailscale.com/helmcharts
  - name: traefik
    url: https://traefik.github.io/charts

releases:
###  CORE  ###
  - name: namespaces
    chart: ./core/namespaces
    historyMax: 5
    namespace: kube-system
  - name: rbac-policies
    chart: ./core/rbac-policies
    historyMax: 5
    namespace: kube-system
    needs: [kube-system/namespaces]
  - name: cert-manager
    chart: ./core/cert-manager
    historyMax: 5
    namespace: cert-manager
    # The Vault ClusterIssuer template references the cert-manager SA
    # (created by the cert-manager subchart) and butler's Vault PKI setup
    # (created on butler's first reconcile). The issuer reports NotReady
    # until both are present; cert-manager retries automatically.
    needs: [kube-system/namespaces]

###  NETWORKING  ###
  - name: traefik
    chart: ./networking/traefik
    historyMax: 5
    namespace: networking
    needs: [kube-system/namespaces, kube-system/rbac-policies]

###  SECURITY  ###
  - name: vault
    chart: ./security/vault
    historyMax: 5
    namespace: security
    needs: [kube-system/namespaces, kube-system/rbac-policies]
  - name: vault-secrets-operator
    chart: ./security/vault-secrets-operator
    historyMax: 5
    namespace: security
    disableValidation: true
    needs: [kube-system/namespaces, security/butler]
  - name: pocket-id
    chart: ./security/pocket-id
    historyMax: 5
    namespace: security
    # pocket-id needs cert-manager (TLS cert), traefik (ingress), and VSO
    # (Vault-managed encryption-key Secret).
    needs:
      - kube-system/namespaces
      - cert-manager/cert-manager
      - networking/traefik
      - security/vault-secrets-operator
    values:
      - ./security/pocket-id/helmfile-values.yaml.gotmpl
