apiVersion: platform.6940469.xyz/v1alpha1
kind: ManagedCredential
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  vaultPath: monitoring/grafana
  fields:
    admin-user:
      value: admin
    admin-password:
      generate: {type: password, length: 32}
---
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDClient
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
spec:
  type: confidential
  redirectURIs:
    - https://grafana.6940469.xyz/login/generic_oauth
  vaultPath: oauth/grafana
