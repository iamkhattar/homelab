apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  labels:
    app.kubernetes.io/name: letsencrypt-production
    app.kubernetes.io/managed-by: helmfile
spec:
  acme:
    server: {{ .Values.letsencrypt.server | quote }}
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - dns01:
          acmeDNS:
            host: {{ .Values.acmeDNS.host | quote }}
            accountSecretRef:
              name: {{ .Values.acmeDNS.secretName | quote }}
              key: {{ .Values.acmeDNS.secretKey | quote }}
