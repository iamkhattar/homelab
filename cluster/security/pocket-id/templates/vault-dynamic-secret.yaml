# The PostgreSQL credential for Pocket ID. Vault owns the static role; VSO
# reads static-creds/pocketid and composes the connection string here. No
# password, username, or URL is stored in the shared KV document.
#
# allowStaticCreds tells VSO the response is a static role rather than a
# lease-backed dynamic credential. A pod restart re-reads the same password;
# only a deliberate `database/rotate-role/pocketid` changes it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: pocket-id-database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  vaultAuthRef: security/default
  mount: database
  path: static-creds/pocketid
  allowStaticCreds: true
  refreshAfter: 1h
  destination:
    name: pocket-id-database
    create: true
    # The Secret name is reused from the removed VaultStaticSecret. Adopt it
    # rather than failing because the old VSO object created it.
    overwrite: true
    transformation:
      excludes: [".*"]
      templates:
        DB_CONNECTION_STRING:
          text: 'postgresql://{{ `{{ get .Secrets "username" }}` }}:{{ `{{ get .Secrets "password" }}` }}@postgresql.databases.svc.cluster.local:5432/pocketid'
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
