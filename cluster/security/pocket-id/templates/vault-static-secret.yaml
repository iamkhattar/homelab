apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pocket-id-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  vaultAuthRef: security/default
  mount: secret
  type: kv-v2
  path: security/pocket-id
  refreshAfter: 30s
  destination:
    name: pocket-id-credentials
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
---
# The PostgreSQL connection string for Pocket ID. Only that one field is
# projected: the security namespace never receives the other consumers'
# database passwords.
apiVersion: secrets.hashiicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pocket-id-database
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  vaultAuthRef: security/default
  mount: secret
  type: kv-v2
  path: security/pocket-id/database
  refreshAfter: 30s
  destination:
    name: pocket-id-database
    create: true
    transformation:
      excludes: [".*"]
      templates:
        url:
          text: '{{ `{{- get .Secrets "url" -}}` }}'
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
