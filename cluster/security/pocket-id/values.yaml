replicaCount: 1

image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: v2
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 1411

env:
  PUBLIC_APP_URL: ""  # Set via helmfile
  TRUST_PROXY: "true"
  ANALYTICS_DISABLED: "true"
  VERSION_CHECK_DISABLED: "true"

ingress:
  enabled: false
  host: ""  # Set via helmfile

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
