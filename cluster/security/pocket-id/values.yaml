replicaCount: 1

image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: v2.14.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 1411

env:
  APP_URL: ""  # Set via helmfile; Pocket ID uses this as its WebAuthn origin and OIDC issuer.
  # Do not set INTERNAL_APP_URL. Pocket ID uses it to rewrite client-facing
  # discovery endpoints, which would make workstation OIDC clients attempt to
  # resolve Kubernetes-only service DNS. APP_URL is reachable from both sides.
  # Traefik runs inside the K3s pod CIDR. Trust forwarded client headers only
  # from cluster pods instead of accepting them from every source.
  TRUST_PROXY: "10.42.0.0/16"
  PROXY_PROTOCOL: "false"
  ALLOW_INSECURE_CALLBACK_URLS: "false"
  ANALYTICS_DISABLED: "true"
  VERSION_CHECK_DISABLED: "true"
  LOG_LEVEL: "info"
  LOG_JSON: "true"
  # Database query arguments can contain credentials, tokens or personal data.
  LOG_QUERY_ARGS: "false"
  AUDIT_LOG_RETENTION_DAYS: "90"
  DISABLE_RATE_LIMITING: "false"
  OTEL_SERVICE_NAME: "pocket-id"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=homelab,k8s.namespace.name=security"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

ingress:
  enabled: false
  host: ""  # Set via helmfile
  # Traefik serves the shared publicly trusted wildcard certificate.
  tls:
    enabled: true

networkPolicy:
  enabled: true
  # Pocket ID has no required internet egress. DNS stays in-cluster and OTLP
  # is sent only to Alloy once the observability stage exists.
  alloyNamespace: monitoring

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
