replicaCount: 1

image:
  repository: ghcr.io/pocket-id/pocket-id
  tag: v2.14.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  containerPort: 1411

env:
  APP_URL: ""  # Set via helmfile; Pocket ID uses this as its WebAuthn origin and OIDC issuer.
  INTERNAL_APP_URL: "http://pocket-id.security.svc.cluster.local"
  TRUST_PROXY: "true"
  ANALYTICS_DISABLED: "true"
  VERSION_CHECK_DISABLED: "true"
  OTEL_SERVICE_NAME: "pocket-id"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=homelab,k8s.namespace.name=security"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

ingress:
  enabled: false
  host: ""  # Set via helmfile
  # Traefik serves the shared publicly trusted wildcard certificate.
  tls:
    enabled: true

persistence:
  enabled: true
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data
  storageClass: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
