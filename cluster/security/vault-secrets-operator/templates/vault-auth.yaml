apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  vaultConnectionRef: default
  method: {{ .Values.vaultAuth.method }}
  mount: {{ .Values.vaultAuth.mount }}
  allowedNamespaces:
    {{- toYaml .Values.vaultAuth.allowedNamespaces | nindent 4 }}
  kubernetes:
    role: {{ .Values.vaultAuth.role }}
    serviceAccount: {{ .Values.vaultAuth.serviceAccount }}
    audiences:
      - vault
