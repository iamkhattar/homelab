vault-secrets-operator:
  defaultVaultConnection:
    enabled: false
  defaultAuthMethod:
    enabled: false
  controller:
    manager:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi

vaultConnection:
  address: http://vault.security.svc.cluster.local:8200

vaultAuth:
  method: kubernetes
  mount: kubernetes
  role: vso
  serviceAccount: vault-secrets-operator
  allowedNamespaces:
    - cert-manager
    - security
    - databases
    - storage
    - monitoring
    - homepage
    - kitchenowl
    - ntfy
    - paperless-ngx
    - vaultwarden
    - cicd
    - smart-home
    - zigbee

# Application VaultAuth objects are local to their namespace and map to a
# distinct Vault Kubernetes role. A compromised application cannot use VSO to
# read another application's paths.
applicationVaultAuths:
  - namespace: cert-manager
    role: vso-cert-manager
  - namespace: homepage
    role: vso-homepage
  - namespace: kitchenowl
    role: vso-kitchenowl
  - namespace: paperless-ngx
    role: vso-paperless-ngx
  - namespace: vaultwarden
    role: vso-vaultwarden
  - namespace: monitoring
    role: vso-grafana
  - namespace: smart-home
    role: vso-smart-home
  - namespace: zigbee
    role: vso-zigbee
