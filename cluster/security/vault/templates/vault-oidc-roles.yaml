{{- range .Values.oidcRoles }}
---
apiVersion: platform.6940469.xyz/v1alpha1
kind: VaultOIDCRole
metadata:
  name: {{ .group }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: {{ $.Release.Name }}
spec:
  group: {{ .group }}
  policies:
{{- range .policies }}
    - {{ . }}
{{- end }}
  ttl: {{ .ttl | default "1h" }}
  maxTTL: {{ .maxTTL | default "8h" }}
{{- end }}
