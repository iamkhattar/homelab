vault:
  global:
    telemetryEnabled: false
  server:
    enabled: true
    dataStorage:
      enabled: true
      size: 5Gi
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/vault/data"
        }
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  ui:
    enabled: true
  injector:
    enabled: false
  csi:
    enabled: false
