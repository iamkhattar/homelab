vault:
  global:
    telemetryEnabled: false
  server:
    enabled: true
    dataStorage:
      enabled: true
      size: 5Gi
    # Mounts an emptyDir/PVC at /vault/audit so butler can enable the file
    # audit device. Butler writes audit logs here; promtail (later) ships them
    # to Loki.
    auditStorage:
      enabled: true
      size: 2Gi
      mountPath: /vault/audit
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/vault/data"
        }
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  ui:
    enabled: true
  injector:
    enabled: false
  csi:
    enabled: false

# Vault's UI and OIDC API share one private, TLS-terminated Traefik route.
# No Secret is named here: Traefik serves the networking namespace's default
# publicly trusted wildcard certificate from its TLSStore.
ingress:
  enabled: true
  className: traefik
  host: vault.6940469.xyz
