vault:
  global:
    telemetryEnabled: false
  server:
    enabled: true
    dataStorage:
      enabled: true
      size: 5Gi
    # Mounts an emptyDir/PVC at /vault/audit so butler can enable the file
    # audit device. Butler writes audit logs here; promtail (later) ships them
    # to Loki.
    auditStorage:
      enabled: true
      size: 2Gi
      mountPath: /vault/audit
    standalone:
      enabled: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "file" {
          path = "/vault/data"
        }
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  ui:
    enabled: true
  injector:
    enabled: false
  csi:
    enabled: false

# Vault's UI and OIDC API share one private, TLS-terminated Traefik route.
# No Secret is named here: Traefik serves the networking namespace's default
# publicly trusted wildcard certificate from its TLSStore.
ingress:
  enabled: true
  className: traefik
  host: vault.6940469.xyz

# Vault owns the groups that may hold its policies. Each entry becomes a
# VaultOIDCRole resource that Butler reconciles into an auth/jwt role: the group
# is both the OIDC role name and the bound groups claim. Vault's OIDC client
# restricts sign-in to these groups plus the two Butler groups.
oidcRoles:
  - group: vaultadmin
    policies: [vault-admin]
    ttl: 1h
    maxTTL: 8h
  - group: vaultread
    policies: [vault-read]
    ttl: 1h
    maxTTL: 8h
  - group: vaultmeta
    policies: [vault-metadata]
    ttl: 1h
    maxTTL: 8h
  - group: k8sadmin
    policies: [k8s-admin]
    ttl: 1h
    maxTTL: 8h
  - group: k8soperator
    policies: [k8s-operator]
    ttl: 1h
    maxTTL: 8h
  - group: k8sviewer
    policies: [k8s-viewer]
    ttl: 1h
    maxTTL: 4h
