{{- range .Values.groups }}
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDGroup
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Name }}
spec:
  friendlyName: {{ .friendlyName }}
---
{{- end }}
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDClient
metadata:
  name: homelabctl
  namespace: {{ .Release.Namespace }}
spec:
  type: public
  redirectURIs:
    - http://127.0.0.1:17654/callback
  vaultPath: oauth/homelabctl
  allowedUserGroups: [butleradmin, butlerviewer]
---
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDClient
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
spec:
  type: confidential
  redirectURIs:
    - http://localhost:8250/oidc/callback
    - https://vault.6940469.xyz/ui/vault/auth/jwt/oidc/callback
  vaultPath: oauth/vault
  # Vault's OIDC client admits every platform identity: Butler users reach the
  # Vault UI, and each Vault/k8s group logs in with the role carrying its own
  # policy. The group list is the sign-in allowlist, not the authorization
  # grant; VaultOIDCRole declares what each group may do.
  allowedUserGroups: [butleradmin, butlerviewer, vaultadmin, vaultread, vaultmeta, k8sadmin, k8soperator, k8sviewer]
