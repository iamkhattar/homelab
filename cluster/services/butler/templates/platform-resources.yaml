{{- range .Values.groups }}
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDGroup
metadata:
  name: {{ .name }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Name }}
spec:
  friendlyName: {{ .friendlyName }}
---
{{- end }}
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDClient
metadata:
  name: homelabctl
  namespace: {{ .Release.Namespace }}
spec:
  type: public
  redirectURIs:
    - http://127.0.0.1:17654/callback
  vaultPath: oauth/homelabctl
  allowedUserGroups: [homelab-admin, homelab-operator, homelab-viewer]
---
apiVersion: platform.6940469.xyz/v1alpha1
kind: PocketIDClient
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
spec:
  type: confidential
  redirectURIs:
    - http://localhost:8250/oidc/callback
    - https://vault.6940469.xyz/ui/vault/auth/jwt/oidc/callback
  vaultPath: oauth/vault
  allowedUserGroups: [homelab-admin, homelab-operator, homelab-viewer]
