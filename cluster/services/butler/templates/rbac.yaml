apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-platform-controller
rules:
  - apiGroups: ["platform.6940469.xyz"]
    resources: ["pocketidclients", "pocketidgroups", "managedcredentials", "garagebuckets"]
    verbs: ["get", "list"]
  - apiGroups: ["platform.6940469.xyz"]
    resources: ["pocketidclients/status", "pocketidgroups/status", "managedcredentials/status", "garagebuckets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["platform.6940469.xyz"]
    resources: ["butleroperations"]
    verbs: ["create", "get", "list", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-platform-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-platform-controller
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.recovery.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.recovery.serviceAccount }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.recovery.clientServiceAccount }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-recovery-platform-bootstrap
rules:
  - apiGroups: ["platform.6940469.xyz"]
    # GarageBucket is read-only here because cross-kind Vault output-path
    # ownership must also be safe during bootstrap reconciliation.
    resources: ["pocketidclients", "pocketidgroups", "managedcredentials", "garagebuckets"]
    verbs: ["get", "list"]
  - apiGroups: ["platform.6940469.xyz"]
    resources: ["pocketidclients/status", "pocketidgroups/status", "managedcredentials/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-recovery-platform-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-recovery-platform-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ .Values.recovery.serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-recovery
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["butler-vault-init", "vault-k8s-token-reviewer-token"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["butler-bootstrap-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-recovery
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-recovery
subjects:
  - kind: ServiceAccount
    name: {{ .Values.recovery.serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-recovery-token-review
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-recovery-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-recovery-token-review
subjects:
  - kind: ServiceAccount
    name: {{ .Values.recovery.serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-certificate-reader
  namespace: networking
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["homelab-wildcard-tls"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-certificate-reader
  namespace: networking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-certificate-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.recovery.serviceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}
