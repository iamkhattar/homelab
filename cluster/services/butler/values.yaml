# Pocket ID groups Butler provisions. PocketIDClient resources reference these
# names in spec.allowedUserGroups; the reconciler resolves them to Pocket ID
# group IDs and fails closed when a referenced group does not exist.
#
# Two groups grant Butler roles. Six are Vault authority groups: the Vault
# chart declares the policy mapping with VaultOIDCRole resources, so membership
# is enforced by Vault, not by Butler. household is application access only.
groups:
  - name: butleradmin
    friendlyName: Butler administrators
  - name: butlerviewer
    friendlyName: Butler viewers
  - name: vaultadmin
    friendlyName: Vault administrators
  - name: vaultread
    friendlyName: Vault secret readers
  - name: vaultmeta
    friendlyName: Vault metadata readers
  - name: k8sadmin
    friendlyName: Kubernetes administrators
  - name: k8soperator
    friendlyName: Kubernetes operators
  - name: k8sviewer
    friendlyName: Kubernetes viewers
  - name: household
    friendlyName: Household members who use the shared applications

replicaCount: 1

image:
  repository: iamkhattar/butler
  # Pin to a real version; CI tags images with the git SHA. Use 'latest' only
  # for local dev. The homelabctl build command sets production image tags.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  containerPort: 8080

ingress:
  enabled: true
  host: butler.6940469.xyz
  className: traefik

# Environment variables passed to the butler container. Tiny set — anything
# runtime policy lives in the config ConfigMap below and provider intent lives
# in typed Kubernetes resources. These are kept here as
# escape hatches for log level + alt config path overrides.
env:
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4318"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

serviceAccount:
  name: butler

recovery:
  enabled: true
  serviceAccount: butler-recovery
  clientServiceAccount: butler-recovery-client
  service:
    port: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  minAvailable: 0

# Egress is locked down to Vault (in security/), Pocket-ID (in security/),
# and the K8s API. Ingress allowed from anywhere in-cluster (HTTP API).
networkPolicy:
  enabled: true
  vaultNamespace: security
  pocketIdNamespace: security
  ingressNamespace: networking
  kubernetesAPI:
    # K3s' kubernetes.default Service IP plus Titan's sole API endpoint. Both
    # are required because NetworkPolicy enforcement may observe traffic
    # before or after Service DNAT. Override these in a future cluster profile.
    cidrs:
      - 10.43.0.1/32
      - 192.168.1.163/32

# Butler's runtime configuration. Rendered into a ConfigMap and mounted at
# /etc/butler/config.yaml inside the container. This replaces the embedded
# butler.yaml fallback at runtime.
#
# Shared endpoints, certificate policy, Vault roles and K8s issuance live here.
# Pocket ID clients and generated credentials live beside their owning charts.
config:
  vault:
    address: http://vault.security.svc.cluster.local:8200
    # Vault's database secrets engine owns the shared PostgreSQL connection.
    # Only the admin password remains in KV; consumers receive static roles
    # whose rotation is a deliberate operator action.
    database:
      enabled: true
      mount: database
      connectionName: postgresql
      address: postgresql.databases.svc.cluster.local:5432
      adminUsername: postgres
      adminSecretPath: databases/postgresql
      adminSecretKey: postgres-password
    kubernetesAuth:
      role: butler
      tokenPath: /var/run/secrets/butler-vault/token
      consumers:
        - name: vso-homepage
          namespace: homepage
          serviceAccounts: [default]
          paths:
            - applications/homepage
            - oauth/homepage
        - name: vso-kitchenowl
          namespace: kitchenowl
          serviceAccounts: [default]
          paths:
            - applications/kitchenowl
            - applications/kitchenowl/database
        - name: vso-paperless-ngx
          namespace: paperless-ngx
          serviceAccounts: [default]
          paths:
            - applications/paperless-ngx
            - applications/paperless-ngx/database
            - applications/paperless-ngx/redis
        - name: vso-vaultwarden
          namespace: vaultwarden
          serviceAccounts: [default]
          paths:
            - applications/vaultwarden
            - applications/vaultwarden/database
            - oauth/vaultwarden
        - name: vso-grafana
          namespace: monitoring
          serviceAccounts: [default]
          paths:
            - monitoring/grafana
            - oauth/grafana
        - name: vso-cert-manager
          namespace: cert-manager
          serviceAccounts: [default]
          paths:
            - infrastructure/acme-dns
        - name: vso-smart-home
          namespace: smart-home
          serviceAccounts: [default]
          paths:
            - smart-home/mqtt
        - name: vso-zigbee
          namespace: zigbee
          serviceAccounts: [default]
          paths:
            - smart-home/mqtt
            - smart-home/zigbee2mqtt
        # Data namespaces read only their own paths. PostgreSQL and Redis share
        # the databases namespace and project from two distinct Vault paths.
        - name: vso-databases
          namespace: databases
          serviceAccounts: [default]
          paths:
            - databases/postgresql
            - databases/redis
        - name: vso-storage
          namespace: storage
          serviceAccounts: [default]
          paths:
            - storage/garage
        - name: vso-cicd
          namespace: cicd
          serviceAccounts: [default]
          paths:
            - cicd/github-actions
  server:
    port: "8080"
  reconcile:
    # Platform CR changes trigger an immediate, coalesced reconciliation. This
    # interval remains the bounded drift-repair resync if an event is missed.
    interval: 1m
  oidc:
    # Set to https://auth.<domain> once Pocket-ID is reachable; empty disables
    # OIDC bootstrap of Vault auth/jwt and butler API authz.
    issuer: "https://auth.6940469.xyz"
    # Pocket ID stamps the requesting client's ID as the ID token audience.
    allowedClients:
      - homelabctl
    groups:
      admin: butleradmin
      # The operator tier is disabled: cluster authority is granted by Vault
      # and Kubernetes groups, not by a Butler middle tier.
      operator: ""
      viewer: butlerviewer
    adminURL: http://pocket-id.security.svc.cluster.local
  certificates:
    acmeDNSURL: https://auth.acme-dns.io
    domain: 6940469.xyz
    credentialPath: infrastructure/acme-dns
    namespace: networking
    certificateName: homelab-wildcard
    tlsSecretName: homelab-wildcard-tls
  k8sIssuance:
    enabled: true
    hostNamespace: kube-system
    tokenReviewerNamespace: security
    tokenReviewerSA: vault-k8s-token-reviewer
    # Reference to the Kubernetes Secret object that holds the reviewer token;
    # this ConfigMap contains only the object name, never the token value.
    tokenReviewerRef: vault-k8s-token-reviewer-token
    # Vault Kubernetes secrets-engine roles only. The auth/jwt roles that map a
    # Pocket ID group to Vault policies are declared by the Vault chart as
    # VaultOIDCRole resources, so authorization has exactly one source of truth.
    roles:
      - name: k8sadmin
        serviceAccountName: vault-managed-admin
        ttl: 1h
        maxTTL: 8h
      - name: k8soperator
        serviceAccountName: vault-managed-operator
        ttl: 1h
        maxTTL: 8h
      - name: k8sviewer
        serviceAccountName: vault-managed-viewer
        ttl: 1h
        maxTTL: 4h
  garage:
    enabled: true
    endpoint: http://garage.storage.svc.cluster.local:3903
    adminTokenPath: storage/garage
    adminTokenKey: admin-token
    layout:
      zone: titan
      # Logical Garage capacity budget; keep below the actual persistent disk.
      capacityBytes: 53687091200
