replicaCount: 1

image:
  repository: iamkhattar/butler
  # Pin to a real version; CI tags images with the git SHA. Use 'latest' only
  # for local dev. The homelabctl build command sets production image tags.
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  containerPort: 8080

ingress:
  enabled: true
  host: butler.6940469.xyz
  className: traefik

# Environment variables passed to the butler container. Tiny set — anything
# substantive lives in the config ConfigMap below. These are kept here as
# escape hatches for log level + alt config path overrides.
env:
  LOG_LEVEL: "info"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.monitoring.svc.cluster.local:4318"
  BUTLER_OPERATIONS_PATH: "/var/lib/butler/operations.json"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

serviceAccount:
  name: butler

recovery:
  enabled: true
  serviceAccount: butler-recovery
  clientServiceAccount: butler-recovery-client
  service:
    port: 8081

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podDisruptionBudget:
  enabled: true
  minAvailable: 0

# Egress is locked down to Vault (in security/), Pocket-ID (in security/),
# and the K8s API. Ingress allowed from anywhere in-cluster (HTTP API).
networkPolicy:
  enabled: true
  vaultNamespace: security
  pocketIdNamespace: security

# Butler's runtime configuration. Rendered into a ConfigMap and mounted at
# /etc/butler/config.yaml inside the container. This replaces the embedded
# butler.yaml fallback at runtime.
#
# Everything butler used to require a rebuild for (certificate domain, OAuth clients,
# Vault JWT roles, K8s issuance roles) lives here.
config:
  vault:
    address: http://vault.security.svc.cluster.local:8200
    kubernetesAuth:
      role: butler
      tokenPath: /var/run/secrets/butler-vault/token
      consumers:
        - name: vso-kitchenowl
          namespace: kitchenowl
          serviceAccounts: [default]
          paths:
            - applications/kitchenowl
            - applications/kitchenowl/database
        - name: vso-paperless-ngx
          namespace: paperless-ngx
          serviceAccounts: [default]
          paths:
            - applications/paperless-ngx
            - applications/paperless-ngx/database
            - applications/paperless-ngx/redis
        - name: vso-vaultwarden
          namespace: vaultwarden
          serviceAccounts: [default]
          paths:
            - applications/vaultwarden
            - applications/vaultwarden/database
            - oauth/vaultwarden
        - name: vso-grafana
          namespace: monitoring
          serviceAccounts: [default]
          paths:
            - monitoring/grafana
            - oauth/grafana
        - name: vso-cert-manager
          namespace: cert-manager
          serviceAccounts: [default]
          paths:
            - infrastructure/acme-dns
  server:
    port: "8080"
  reconcile:
    interval: 5m
  oidc:
    # Set to https://auth.<domain> once Pocket-ID is reachable; empty disables
    # OIDC bootstrap of Vault auth/jwt and butler API authz.
    issuer: "https://auth.6940469.xyz"
    audience: butler
    allowedAudiences:
      - homelabctl
    adminURL: http://pocket-id.security.svc.cluster.local
  # Butler owns group definitions through Pocket ID's admin API. Human users,
  # passkeys, and group membership remain deliberate operator actions.
  pocketIdGroups:
    - name: homelab-admin
      friendlyName: Homelab administrators
    - name: homelab-operator
      friendlyName: Homelab operators
    - name: homelab-viewer
      friendlyName: Homelab viewers
  oauthClients:
    - name: homelabctl
      kind: public
      redirectURIs:
        - http://127.0.0.1:17654/callback
    - name: butler
      kind: public
      redirectURIs:
        - https://butler.6940469.xyz/auth/callback
    - name: vault
      kind: confidential
      redirectURIs:
        - http://localhost:8250/oidc/callback
        - https://vault.6940469.xyz/ui/vault/auth/jwt/oidc/callback
    - name: grafana
      kind: confidential
      redirectURIs:
        - https://grafana.6940469.xyz/login/generic_oauth
    - name: vaultwarden
      kind: confidential
      redirectURIs:
        - https://vaultwarden.6940469.xyz/identity/connect/oidc-signin
  certificates:
    acmeDNSURL: https://auth.acme-dns.io
    domain: 6940469.xyz
    credentialPath: infrastructure/acme-dns
    namespace: networking
    certificateName: homelab-wildcard
    tlsSecretName: homelab-wildcard-tls
  k8sIssuance:
    enabled: true
    hostNamespace: kube-system
    tokenReviewerNamespace: security
    tokenReviewerSA: vault-k8s-token-reviewer
    # Reference to the Kubernetes Secret object that holds the reviewer token;
    # this ConfigMap contains only the object name, never the token value.
    tokenReviewerRef: vault-k8s-token-reviewer-token
    roles:
      - name: homelab-admin
        serviceAccountName: vault-managed-admin
        ttl: 1h
        maxTTL: 8h
        pocketIdGroup: homelab-admin
        vaultPolicies:
          - vault-admin
          - k8s-admin
      - name: homelab-operator
        serviceAccountName: vault-managed-operator
        ttl: 1h
        maxTTL: 8h
        pocketIdGroup: homelab-operator
        vaultPolicies:
          - vault-read
          - k8s-operator
      - name: homelab-viewer
        serviceAccountName: vault-managed-viewer
        ttl: 1h
        maxTTL: 4h
        pocketIdGroup: homelab-viewer
        vaultPolicies:
          - vault-read
          - k8s-viewer
  secrets:
    - path: security/pocket-id
      keys:
        encryption-key:
          length: 32
    - path: databases/postgresql
      keys:
        postgres-password:
          length: 32
        kitchenowl-password:
          length: 32
        paperless-password:
          length: 32
        vaultwarden-password:
          length: 32
        vaultwarden-url:
          template: "postgresql://vaultwarden:{{vaultwarden-password}}@postgresql.databases.svc.cluster.local:5432/vaultwarden"
        init.sql:
          template: |
            CREATE ROLE kitchenowl LOGIN PASSWORD '{{kitchenowl-password}}';
            CREATE DATABASE kitchenowl OWNER kitchenowl;
            CREATE ROLE paperless LOGIN PASSWORD '{{paperless-password}}';
            CREATE DATABASE paperless OWNER paperless;
            CREATE ROLE vaultwarden LOGIN PASSWORD '{{vaultwarden-password}}';
            CREATE DATABASE vaultwarden OWNER vaultwarden;
    - path: databases/redis
      keys:
        redis-password:
          length: 32
        redis-url:
          template: "redis://:{{redis-password}}@redis-master.databases.svc.cluster.local:6379/0"
    - path: storage/garage
      keys:
        rpc-secret:
          hexLength: 32
        admin-token:
          length: 32
        metrics-token:
          length: 32
    - path: applications/kitchenowl
      keys:
        jwt-secret:
          length: 48
    - path: applications/paperless-ngx
      keys:
        secret-key:
          length: 48
        admin-user:
          static: admin
        admin-password:
          length: 32
    - path: applications/vaultwarden
      keys:
        admin-token:
          length: 48
    - path: monitoring/grafana
      keys:
        admin-user:
          static: admin
        admin-password:
          length: 32
  managedCredentials:
    - sourcePath: databases/postgresql
      destinationPath: applications/kitchenowl/database
      keys:
        password: kitchenowl-password
      static:
        username: kitchenowl
    - sourcePath: databases/postgresql
      destinationPath: applications/paperless-ngx/database
      keys:
        password: paperless-password
      static:
        username: paperless
    - sourcePath: databases/redis
      destinationPath: applications/paperless-ngx/redis
      keys:
        redis-url: redis-url
    - sourcePath: databases/postgresql
      destinationPath: applications/vaultwarden/database
      keys:
        database-url: vaultwarden-url
  garage:
    enabled: true
    endpoint: http://garage.storage.svc.cluster.local:3903
    adminTokenPath: storage/garage
    adminTokenKey: admin-token
    layout:
      zone: titan
      # Logical Garage capacity budget; keep below the actual persistent disk.
      capacityBytes: 53687091200
    buckets:
      - name: homelab-backups
        credentialPath: storage/garage/clients/backups
        read: true
        write: true
        owner: false
