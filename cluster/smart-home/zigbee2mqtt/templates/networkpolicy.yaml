apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: networking}
      ports:
        - {protocol: TCP, port: {{ .Values.service.containerPort }}}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: smart-home}
          podSelector:
            matchLabels: {app.kubernetes.io/name: mosquitto}
      ports:
        - {protocol: TCP, port: 1883}
    # OTA firmware retrieval is opt-in per device but requires HTTPS egress.
    - ports:
        - {protocol: TCP, port: 443}
