apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: garage-config
  namespace: {{ .Release.Namespace }}
spec:
  vaultAuthRef: security/default
  mount: secret
  type: kv-v2
  path: storage/garage
  refreshAfter: 5m
  destination:
    name: garage-config
    create: true
    transformation:
      excludes: [".*"]
      templates:
        garage.toml:
          text: |
            metadata_dir = "/var/lib/garage/meta"
            data_dir = "/var/lib/garage/data"
            db_engine = "lmdb"
            metadata_auto_snapshot_interval = "6h"
            replication_factor = 1
            compression_level = 2
            rpc_bind_addr = "[::]:3901"
            rpc_secret = "{{ `{{- get .Secrets "rpc-secret" -}}` }}"

            [s3_api]
            s3_region = "garage"
            api_bind_addr = "[::]:3900"
            root_domain = ".s3.garage.storage.svc.cluster.local"

            [s3_web]
            bind_addr = "[::]:3902"
            root_domain = ".web.garage.storage.svc.cluster.local"
            index = "index.html"

            [admin]
            api_bind_addr = "[::]:3903"
            admin_token = "{{ `{{- get .Secrets "admin-token" -}}` }}"
            metrics_token = "{{ `{{- get .Secrets "metrics-token" -}}` }}"
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ .Release.Name }}
