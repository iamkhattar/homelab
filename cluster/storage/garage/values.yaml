replicaCount: 1

image:
  repository: dxflrs/garage
  tag: "v1.0.1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  s3Port: 3900
  webPort: 3902
  adminPort: 3903

env:
  GARAGE_RPC_SECRET: ""  # Set via Vault secret

envFromSecrets:
  - secretName: garage-credentials
    keys:
      GARAGE_RPC_SECRET: rpc-secret

persistence:
  data:
    enabled: true
    size: 50Gi
    accessMode: ReadWriteOnce
    mountPath: /var/lib/garage/data
    storageClass: ""
  meta:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    mountPath: /var/lib/garage/meta
    storageClass: ""

config:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "lmdb"
    replication_factor = 1

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    root_domain = ".s3.garage.localhost"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.garage.localhost"

    [admin]
    api_bind_addr = "[::]:3903"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
