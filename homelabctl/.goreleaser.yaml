version: 2

project_name: homelabctl

builds:
  - id: homelabctl
    main: ./cmd/homelabctl
    binary: homelabctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Tag }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: homelabctl
    ids:
      - homelabctl
    formats:
      - tar.gz
    name_template: "homelabctl_{{ .Os }}_{{ .Arch }}"
    files: []

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: false
  prerelease: false
  name_template: "homelabctl {{ .Tag }}"
